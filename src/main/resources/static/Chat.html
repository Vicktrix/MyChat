<!DOCTYPE html>
<html>
    <head>
            <title>chat 2</title>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <link href="css/Chat.css" rel="stylesheet" type="text/css"/>
            <script defer src="js/Chat.js" type="application/javascript"></script>
    </head>
    <body>
<!--        
        localhost:8080/chat
        -->
        <div id="container">
            <div id="header">
                <label for="user">UserName :</label>
                    <select name="user" id="user">
                    <option value="user1">user1</option>
                    <option value="user2">user2</option>
                    <option value="user3">user3</option>
                    <option value="user4">user4</option>
                </select>
                <label for="chat">Chat:</label>
                    <select name="chat" id="chat">
                    <option value="chat1">chat1</option>
                    <option value="chat2">chat2</option>
                    <option value="chat3">chat3</option>
                    <option value="chat4">chat4</option>
                </select>
                <input type="text" id="findOrCreate" placeholder="find User or create chat" size="18">
                <button id="find">Find</button>
                <button id="create">Create</button>
            </div>
            <div id="viewchat">
                <div id="posts">
                </div>
                <div id="presents">
                    <h3>Presents : </h3>
                </div>
            </div>
            <div id="sendarea">
                <textarea autofocus id="mypost" rows="2" cols="10" placeholder="here my post"></textarea>
                <button id="send">Send</button>
            </div>
        </div>
    </body>
</html>
